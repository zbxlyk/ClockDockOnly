name: Build ClockDockOnly

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build rootful + rootless deb
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git make fakeroot curl ca-certificates \
            libssl-dev zlib1g-dev libplist-dev || true

      # ---------- Theos + iOS SDK（缓存）----------
      - name: 缓存 Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-linux-v2

      - name: 安装 Theos + iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/theos/theos.git theos
          curl -L -o /tmp/sdks.tar.gz \
            https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          mkdir -p theos/sdks
          cp -R /tmp/sdks-master/*.sdk theos/sdks/
          echo "--- SDKS ---"; ls theos/sdks

      - name: 校验 SDK
        run: |
          ls theos/sdks | head
          ls theos/sdks/iPhoneOS16.5.sdk/SDKSettings.plist && echo "SDK OK"

      # ---------- 构建 ----------
      - name: 编译
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -e
          # rootful
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 PACKAGE_VERSION=1.0.0
          # 把产物另存，避免被下一次 clean
          mkdir -p out
          cp packages/*.deb out/ 2>/dev/null || true

          # rootless
          make clean 2>/dev/null || true
          make package ROOTLESS=1 FINALPACKAGE=1 PACKAGE_VERSION=1.0.0
          cp packages/*.deb out/ 2>/dev/null || true

          echo "--- 产物 ---"; ls -la out/

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: ClockDockOnly-deb
          path: out/*.deb
          if-no-files-found: error

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ClockDockOnly-dylib
          path: |
            .theos/obj/**/*.dylib
            .theos/obj/*.dylib
          if-no-files-found: warn
