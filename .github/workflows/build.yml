name: Build ClockDockOnly dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build dylib (arm64 + arm64e)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git make fakeroot curl ca-certificates \
            xz-utils libssl-dev zlib1g-dev libplist-dev perl rsync || true

      - name: 缓存 Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-linux-v3

      - name: 安装 Theos + 工具链 + iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/theos/theos.git theos
          mkdir -p theos/toolchain
          curl -L --retry 3 -o /tmp/tc.tar.xz \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz
          tar -xJf /tmp/tc.tar.xz -C theos/toolchain/
          ls theos/toolchain/linux/iphone/bin/clang && echo "clang OK"
          curl -L --retry 3 -o /tmp/sdks.tar.gz \
            https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          mkdir -p theos/sdks
          cp -R /tmp/sdks-master/*.sdk theos/sdks/
          ls theos/sdks

      # ---------- 编译（允许 stage/package 步骤失败，只要 dylib 编出来）----------
      - name: 编译 dylib
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean 2>/dev/null || true
          # FINALPACKAGE=1 → release 构建（非 debug），会生成 .theos/obj/<arch>/*.dylib
          # 即使后面的打包阶段失败，dylib 也已经生成
          make package FINALPACKAGE=1 PACKAGE_VERSION=1.0.0 || echo "打包步骤失败，但继续收集 dylib"
          echo "=== 找 dylib ==="
          find .theos -name "*.dylib" -exec ls -la {} \; || true

      - name: 收集产物
        run: |
          set -e
          mkdir -p out
          find .theos -name "ClockDockOnly.dylib" -exec cp {} out/ \;
          ls -la out/
          if [ ! -f out/ClockDockOnly.dylib ]; then
            echo "❌ 没找到 dylib"; exit 1
          fi
          # 顺便打包成 deb（如果生成了）
          cp packages/*.deb out/ 2>/dev/null || true
          ls -la out/

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: ClockDockOnly-build
          path: out/*
          if-no-files-found: error
