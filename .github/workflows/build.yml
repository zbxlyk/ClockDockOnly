name: Build ClockDockOnly dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build dylib (arm64 + arm64e)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git make fakeroot curl ca-certificates \
            xz-utils libssl-dev zlib1g-dev libplist-dev perl rsync || true

      - name: 缓存 Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-linux-v3

      - name: 安装 Theos + 工具链 + iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/theos/theos.git theos
          mkdir -p theos/toolchain
          curl -L --retry 3 -o /tmp/tc.tar.xz \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz
          tar -xJf /tmp/tc.tar.xz -C theos/toolchain/
          ls theos/toolchain/linux/iphone/bin/clang && echo "clang OK"
          curl -L --retry 3 -o /tmp/sdks.tar.gz \
            https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          mkdir -p theos/sdks
          cp -R /tmp/sdks-master/*.sdk theos/sdks/
          ls theos/sdks

      # ---------- 只编译，不打包 ----------
      - name: 编译 dylib
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -e
          make clean 2>/dev/null || true
          # 只编 dylib，跳过 stage/package（不生成 deb）
          make ClockDockOnly
          echo "=== 产物 ==="
          find .theos -name "*.dylib" -exec ls -la {} \;

      - name: 收集产物
        run: |
          set -e
          mkdir -p out
          # 把 dylib 和 plist 一起收集
          find .theos -name "ClockDockOnly.dylib" -exec cp {} out/ \;
          cp ClockDockOnly.plist out/ 2>/dev/null || cp layout/Library/MobileSubstrate/DynamicLibraries/ClockDockOnly.plist out/
          ls -la out/

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: ClockDockOnly-dylib
          path: out/*
          if-no-files-found: error
